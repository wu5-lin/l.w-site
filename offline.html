<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'" />
  <title>离线状态 | LW 智能实验工具</title>

<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>

  <header class="nav">

        <p class="error-kicker">You are offline</p>
        <p class="error-code" aria-hidden="true">离线</p>

        <div class="error-links">
          <a href="/" class="btn btn-primary">返回首页</a>
          <a href="/ai-particle-size-analyzer/" class="btn btn-ghost">打开 SEM 粒径分析</a>
          <a href="/research-charts/" class="btn btn-ghost">打开图表生成器</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>© 2026 LW. 保留所有权利。</p>
      <p class="footer-domain">l-w.sryze.cc</p>
    </div>
