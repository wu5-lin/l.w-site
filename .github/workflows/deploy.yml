name: Deploy to GitHub Pages

on:
  # 推送到 main 就会发布。Pages CMS 保存文章也是一次普通提交，会走这里。
  push:
    branches: [main]
  workflow_dispatch:
  # 简报工作流用默认令牌提交。这种提交不会触发上面的 push，所以改在简报跑完后再发布。
  # workflows 要和 digest.yml 的 name 完全一致。之前写成了缩短的 “Refresh Digest”，对不上，发布就不会开始。
  workflow_run:
    workflows: ["Refresh Digest (投资/科研/web3/科技)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          # 普通推送和手动发布：用触发这次运行的提交。
          # 简报跑完再发布时，head_sha 仍是简报开始前的旧提交，刚写入的 digest.json 不在里面。
          # 这时按分支名取出最新的 main。
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.sha }}
      - name: Install, build, and upload your site output
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
