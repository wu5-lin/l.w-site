name: Refresh Digest (投资/科研/web3/科技)

on:
  schedule:
    - cron: "0 1 * * *"      # 每天 UTC 01:00 = 北京 09:00 自动刷新
  workflow_dispatch:        # 也支持在 GitHub 网页手动点一下立即运行

permissions:
  contents: write           # 允许工作流提交 digest.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest digest
        env:
          XQ_TOKEN: ${{ secrets.XQ_TOKEN }}
        run: python fetch_digest.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest.json
          if git diff --cached --quiet; then
            echo "No digest changes."
          else
            git commit -m "auto: refresh digest"
            git push
          fi
