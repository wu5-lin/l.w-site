name: Refresh AI News & Publish

on:
  schedule:
    - cron: "0 0 * * *"      # 每天 UTC 00:00 = 北京 08:00 自动刷新
  workflow_dispatch:        # 也支持在 GitHub 网页手动点一下立即运行

permissions:
  contents: write           # 允许工作流提交 news.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest AI news
        run: python fetch_news.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes."
          else
            git commit -m "auto: refresh AI news"
            git push
          fi
